name: siderascan-n8n

services:
  n8n-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_POSTGRESDB_USER:-n8n} -d ${DB_POSTGRESDB_DATABASE:-n8n}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - n8n_internal

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-1.123.71}
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_PORT: ${N8N_PORT:-5678}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Jakarta}
      TZ: ${TZ:-Asia/Jakarta}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: ${DB_TYPE:-postgresdb}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-n8n-postgres}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      SIDERASCAN_WEBHOOK_SECRET: ${SIDERASCAN_WEBHOOK_SECRET}
      SIDERASCAN_SIGNATURE_TOLERANCE_SECONDS: ${SIDERASCAN_SIGNATURE_TOLERANCE_SECONDS:-300}
      NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-crypto,https,process}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SIDERASCAN_API_BASE_URL: ${SIDERASCAN_API_BASE_URL:-http://host.docker.internal:4000}
      SIDERASCAN_AI_PROMPT_VERSION: ${SIDERASCAN_AI_PROMPT_VERSION:-n8n-ai-review-v1}
      DISCORD_SECURITY_ALERT_WEBHOOK_ENABLED: ${DISCORD_SECURITY_ALERT_WEBHOOK_ENABLED:-false}
      DISCORD_SECURITY_ALERT_WEBHOOK_URL: ${DISCORD_SECURITY_ALERT_WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    expose:
      - "5678"
    networks:
      - n8n_internal

volumes:
  n8n_data:
  n8n_postgres_data:

networks:
  n8n_internal:
    driver: bridge
